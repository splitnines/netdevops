all:
  children:
    all_devices:
      hosts:
        r1:
          ansible_host: 10.1.254.1
        r2:
          ansible_host: 10.1.254.2
        r3:
          ansible_host: 10.2.254.3
        r4:
          ansible_host: 10.2.254.4
        r5:
          ansible_host: 10.2.254.5
        r6:
          ansible_host: 10.3.254.6

      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_become: true
        ansible_become_method: enable
        # ansible_user: "{{ vault_ios_user }}"
        # ansible_password: "{{ vault_ios_pass }}"
        ansible_user: "{{ lookup('env', 'CISCO_USER') }}"
        ansible_password: "{{ lookup('env', 'CISCO_PASS') }}"
        ansible_become_password: "{{ lookup('env', 'CISCO_PASS') }}"
        ansible_command_timeout: 60
        ansible_connect_timeout: 60

    ospfv3_routers:
      hosts:
        r3:
        r4:
        r5:

    eigrp_routers:
      hosts:
        r1:
        r2:
