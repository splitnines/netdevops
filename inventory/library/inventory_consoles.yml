all:
  children:
    consoles:
      hosts:
        r1:
          ansible_host: localhost
          telnet_port: 9001
        r2:
          ansible_host: localhost
          telnet_port: 9002
        r3:
          ansible_host: localhost
          telnet_port: 9003
        r4:
          ansible_host: localhost
          telnet_port: 9004
        r5:
          ansible_host: localhost
          telnet_port: 9005
        r6:
          ansible_host: localhost
          telnet_port: 9006

      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        telnet_user: "{{ lookup('env', 'CISCO_USER') }}"
        telnet_password: "{{ lookup('env', 'CISCO_PASS') }}"
        ansible_command_timeout: 60
        ansible_connect_timeout: 60
